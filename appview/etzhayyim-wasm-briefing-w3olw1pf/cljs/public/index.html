<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Briefing — KAMI WebRTC</title>
    <link rel="stylesheet" href="vendor/kotoba-ui.css">
    <style>
      body { margin: 0; font-family: 'Nunito', system-ui, -apple-system, sans-serif; background: #f0ead6; color: #1a1a2e; }
      .app { max-width: 700px; margin: 0 auto; padding: 1rem; min-height: 100vh; display: flex; flex-direction: column; gap: 1rem; }
      header { display: flex; align-items: center; gap: 0.75rem; }
      header h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }
      .badge { background: #e74c6f; color: white; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; }
      .panel { background: white; border-radius: 16px; padding: 1.25rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
      .panel h2 { margin: 0 0 1rem; font-size: 1.1rem; font-weight: 700; }
      .panel h3 { margin: 0.5rem 0; font-size: 0.9rem; font-weight: 700; }
      .form-grid { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem; }
      .form-grid label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.8rem; font-weight: 600; }
      .form-grid input { padding: 0.5rem 0.75rem; border: 2px solid #e2dcc8; border-radius: 10px; font-size: 0.9rem; background: #faf8f0; }
      .form-grid input:focus { outline: none; border-color: #e74c6f; }
      .media-warn { color: #d97706; font-size: 0.8rem; font-weight: 600; margin: 0 0 0.5rem; }
      .btn { padding: 0.5rem 1rem; border: none; border-radius: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; background: #e2dcc8; color: #1a1a2e; }
      .btn:hover { transform: translateY(-1px); }
      .btn.primary { background: #e74c6f; color: white; }
      .btn.danger { background: #dc2626; color: white; }
      .btn.active { background: #16a34a; color: white; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .room-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
      .room-header h2 { margin: 0; flex: 1; }
      .peer-count { background: #16a34a; color: white; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
      .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
      .video-cell { text-align: center; }
      .video-container { position: relative; width: 100%; aspect-ratio: 4/3; background: #1a1a2e; border-radius: 12px; overflow: hidden; }
      .video-container video { width: 100%; height: 100%; object-fit: cover; }
      .video-placeholder { position: absolute; inset: 0; display: grid; place-content: center; color: #6b7280; font-weight: 600; font-size: 0.85rem; }
      .video-label { font-size: 0.75rem; font-weight: 600; margin-top: 0.3rem; color: #4b5563; }
      .connected-dot { display: inline-block; width: 8px; height: 8px; background: #16a34a; border-radius: 50%; margin-left: 0.3rem; vertical-align: middle; }
      .media-controls { display: flex; gap: 0.5rem; justify-content: center; }
      .log-panel { flex: 1; min-height: 100px; }
      .log { max-height: 150px; overflow-y: auto; font-family: 'SF Mono', monospace; font-size: 0.7rem; line-height: 1.4; }
      .log-entry { padding: 0.1rem 0; border-bottom: 1px solid #f0ead6; }
      .log-entry.dim { color: #9ca3af; }
      .btn.recording { background: #dc2626; color: white; animation: pulse 1s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
      .project-badge { background: #2563eb; }
      .transcript-text { font-size: 0.85rem; line-height: 1.5; padding: 0.75rem; background: #faf8f0; border-radius: 8px; margin-bottom: 0.5rem; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
      .transcript-text.translated { background: #eff6ff; border-left: 3px solid #2563eb; }
      .actor-list { display: flex; flex-direction: column; gap: 0.3rem; }
      .actor-item { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.6rem; background: #faf8f0; border-radius: 8px; font-size: 0.75rem; }
      .actor-role { font-weight: 700; color: #1a1a2e; }
      .actor-did { font-family: 'SF Mono', monospace; color: #6b7280; font-size: 0.65rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="js/app.js"></script>
  </body>
</html>
